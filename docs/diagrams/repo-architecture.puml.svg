<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1309px" preserveAspectRatio="none" style="width:4402px;height:1309px;background:#FFFFFF;" version="1.1" viewBox="0 0 4402 1309" width="4402px" zoomAndPan="magnify"><title>short-circuit &#8212; WireGuard Mesh with Optional Nord-Protected Egress</title><defs/><g><g class="title" data-source-line="11"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="482.5328" x="1951.7336" y="24.9659">short-circuit &#8212; WireGuard Mesh with Optional Nord-Protected Egress</text></g><!--cluster Conventional Linux profiles--><g class="cluster" data-qualified-name="Conventional Linux profiles" data-source-line="13" id="ent0002"><path d="M4003.5,44.0679 L4194.7628,44.0679 A3.75,3.75 0 0 1 4197.2628,46.5679 L4204.2628,69.1358 L4213.5,69.1358 A2.5,2.5 0 0 1 4216,71.6358 L4216,651.5679 A2.5,2.5 0 0 1 4213.5,654.0679 L4003.5,654.0679 A2.5,2.5 0 0 1 4001,651.5679 L4001,46.5679 A2.5,2.5 0 0 1 4003.5,44.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="4001" x2="4204.2628" y1="69.1358" y2="69.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190.2628" x="4005" y="61.0339">Conventional Linux profiles</text></g><!--cluster Schema-v2 recovery declaration--><g class="cluster" data-qualified-name="Schema-v2 recovery declaration" data-source-line="28" id="ent0014"><path d="M1681.5,44.0679 L1904.4692,44.0679 A3.75,3.75 0 0 1 1906.9692,46.5679 L1913.9692,69.1358 L2056.5,69.1358 A2.5,2.5 0 0 1 2059,71.6358 L2059,500.5679 A2.5,2.5 0 0 1 2056.5,503.0679 L1681.5,503.0679 A2.5,2.5 0 0 1 1679,500.5679 L1679,46.5679 A2.5,2.5 0 0 1 1681.5,44.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="1679" x2="1913.9692" y1="69.1358" y2="69.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="221.9692" x="1683" y="61.0339">Schema-v2 recovery declaration</text></g><!--cluster Per-leaf WireGuard transport--><g class="cluster" data-qualified-name="Per-leaf WireGuard transport" data-source-line="43" id="ent0026"><path d="M2076.5,905.0679 L2280.3523,905.0679 A3.75,3.75 0 0 1 2282.8523,907.5679 L2289.8523,930.1358 L2409.5,930.1358 A2.5,2.5 0 0 1 2412,932.6358 L2412,1152.5679 A2.5,2.5 0 0 1 2409.5,1155.0679 L2076.5,1155.0679 A2.5,2.5 0 0 1 2074,1152.5679 L2074,907.5679 A2.5,2.5 0 0 1 2076.5,905.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="2074" x2="2289.8523" y1="930.1358" y2="930.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="202.8523" x="2078" y="922.0339">Per-leaf WireGuard transport</text></g><!--cluster Roaming coverage policy (render only)--><g class="cluster" data-qualified-name="Roaming coverage policy .render only." data-source-line="52" id="ent0032"><path d="M936.5,407.0679 L1204.8885,407.0679 A3.75,3.75 0 0 1 1207.3885,409.5679 L1214.3885,432.1358 L1589.5,432.1358 A2.5,2.5 0 0 1 1592,434.6358 L1592,796.5679 A2.5,2.5 0 0 1 1589.5,799.0679 L936.5,799.0679 A2.5,2.5 0 0 1 934,796.5679 L934,409.5679 A2.5,2.5 0 0 1 936.5,407.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="934" x2="1214.3885" y1="432.1358" y2="432.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="267.3885" x="938" y="424.0339">Roaming coverage policy (render only)</text></g><!--cluster Multi-service mobile access (render only)--><g class="cluster" data-qualified-name="Multi-service mobile access .render only." data-source-line="65" id="ent0042"><path d="M16.5,407.0679 L300.8905,407.0679 A3.75,3.75 0 0 1 303.3905,409.5679 L310.3905,432.1358 L551.5,432.1358 A2.5,2.5 0 0 1 554,434.6358 L554,787.0679 A2.5,2.5 0 0 1 551.5,789.5679 L16.5,789.5679 A2.5,2.5 0 0 1 14,787.0679 L14,409.5679 A2.5,2.5 0 0 1 16.5,407.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="14" x2="310.3905" y1="432.1358" y2="432.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="283.3905" x="18" y="424.0339">Multi-service mobile access (render only)</text></g><!--cluster Outbound-only NordVPN egress (Linux/rootful Podman)--><g class="cluster" data-qualified-name="Outbound-only NordVPN egress .Linux.rootful Podman." data-source-line="77" id="ent0051"><path d="M2810.5,407.0679 L3200.5131,407.0679 A3.75,3.75 0 0 1 3203.0131,409.5679 L3210.0131,432.1358 L3990.5,432.1358 A2.5,2.5 0 0 1 3993,434.6358 L3993,1299.5679 A2.5,2.5 0 0 1 3990.5,1302.0679 L2810.5,1302.0679 A2.5,2.5 0 0 1 2808,1299.5679 L2808,409.5679 A2.5,2.5 0 0 1 2810.5,407.0679" fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="2808" x2="3210.0131" y1="432.1358" y2="432.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389.0131" x="2812" y="424.0339">Outbound-only NordVPN egress (Linux/rootful Podman)</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="123" id="ent0093"><path d="M1602,703.0679 L1602,801.598 A0,0 0 0 0 1602,801.598 L1978.4073,801.598 A0,0 0 0 0 1978.4073,801.598 L1978.4073,713.0679 L1968.4073,703.0679 L1683.7395,703.0679 L1529.1309,636.6305 L1675.7395,703.0679 L1602,703.0679 A0,0 0 0 0 1602,703.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M1968.4073,703.0679 L1968.4073,713.0679 L1978.4073,713.0679 L1968.4073,703.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="295.4512" x="1608" y="721.9649">stable-primary requires one path across trusted,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="355.4073" x="1608" y="739.6709">isolated, and off-site classes plus leaf transport alignment.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="323.6613" x="1608" y="757.377">Public ingress: default-deny; reviewed UDP port only.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="299.0002" x="1608" y="775.083">Nord is egress-only; reachability stays unverified.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="324.1943" x="1608" y="792.789">No DNS, router, relay, tunnel, or iOS setting changes.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="131" id="ent0096"><path d="M1600.5,594.5679 L1600.5,639.9799 A0,0 0 0 0 1600.5,639.9799 L1931.6282,639.9799 A0,0 0 0 0 1931.6282,639.9799 L1931.6282,604.5679 L1921.6282,594.5679 L1769.4565,594.5679 L1778.6666,495.3039 L1761.4565,594.5679 L1600.5,594.5679 A0,0 0 0 0 1600.5,594.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M1921.6282,594.5679 L1921.6282,604.5679 L1931.6282,604.5679 L1921.6282,594.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="302.1462" x="1606.5" y="613.4649">peer_transit and nord-vpn are mutually exclusive.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="310.1282" x="1606.5" y="631.1709">Public DNS belongs to the canonical mesh binding.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="136" id="ent0099"><path d="M564,730.0679 L564,775.4799 A0,0 0 0 0 564,775.4799 L924.1703,775.4799 A0,0 0 0 0 924.1703,775.4799 L924.1703,740.0679 L914.1703,730.0679 L694.7901,730.0679 L483.5813,646.2167 L686.7901,730.0679 L564,730.0679 A0,0 0 0 0 564,730.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M914.1703,730.0679 L914.1703,740.0679 L924.1703,740.0679 L914.1703,730.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="339.1703" x="570" y="748.9649">One temporary mesh peer plus canonical service peers.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="279.3832" x="570" y="766.6709">Exact disjoint /32 routes; import stays explicit.</text></g><g class="entity" data-qualified-name="GMN101" data-source-line="141" id="ent0102"><path d="M4001,730.0679 L4001,775.4799 A0,0 0 0 0 4001,775.4799 L4395.3084,775.4799 A0,0 0 0 0 4395.3084,775.4799 L4395.3084,740.0679 L4385.3084,730.0679 L4121.243,730.0679 L3476.5073,630.2301 L4113.243,730.0679 L4001,730.0679 A0,0 0 0 0 4001,730.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M4385.3084,730.0679 L4385.3084,740.0679 L4395.3084,740.0679 L4385.3084,730.0679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="316.0693" x="4007" y="748.9649">Render only: no install, secret creation, image build,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="373.3084" x="4007" y="766.6709">Nord login, systemd/Podman start, route change, or live test.</text></g><g class="entity" data-qualified-name="GMN104" data-source-line="146" id="ent0105"><path d="M4001,1077.5679 L4001,1077.5679 L3053.7669,1001.1278 L4001,1085.5679 L4001,1158.392 A0,0 0 0 0 4001,1158.392 L4359.4166,1158.392 A0,0 0 0 0 4359.4166,1158.392 L4359.4166,1087.5679 L4349.4166,1077.5679 L4001,1077.5679 A0,0 0 0 0 4001,1077.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M4349.4166,1077.5679 L4349.4166,1087.5679 L4359.4166,1087.5679 L4349.4166,1077.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="302.6923" x="4007" y="1096.4649">Hard preflight: native Linux, rootful Podman 5.8+,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="337.4166" x="4007" y="1114.1709">ip_forward=1, rp_filter 0/2, full public-key&#8594;/32 equality.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="328.6013" x="4007" y="1131.877">IPv4/IPv6 interface prohibits survive an nftables flush.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="250.8612" x="4007" y="1149.583">Guard persists when the container stops.</text></g><g class="entity" data-qualified-name="GMN107" data-source-line="153" id="ent0108"><path d="M4003.5,941.5679 L4003.5,986.9799 A0,0 0 0 0 4003.5,986.9799 L4346.2893,986.9799 A0,0 0 0 0 4346.2893,986.9799 L4346.2893,951.5679 L4336.2893,941.5679 L4154.0546,941.5679 L3300.7128,771.9711 L4146.0546,941.5679 L4003.5,941.5679 A0,0 0 0 0 4003.5,941.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M4336.2893,941.5679 L4336.2893,951.5679 L4346.2893,951.5679 L4336.2893,941.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="321.7893" x="4009.5" y="960.4649">Raw wg-quick up, wg setconf, and live peer mutation</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.3752" x="4009.5" y="978.1709">bypass this contract and are unsupported.</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="158" id="ent0111"><path d="M2420,1077.5679 L2420,1158.392 A0,0 0 0 0 2420,1158.392 L2799.6312,1158.392 A0,0 0 0 0 2799.6312,1158.392 L2799.6312,1095.5679 L3124.8464,1002.7366 L2799.6312,1087.5679 L2799.6312,1087.5679 L2789.6312,1077.5679 L2420,1077.5679 A0,0 0 0 0 2420,1077.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M2789.6312,1077.5679 L2789.6312,1087.5679 L2799.6312,1087.5679 L2789.6312,1077.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="308.9453" x="2426" y="1096.4649">Expired generations fail guard startup/verification.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="316.2773" x="2426" y="1114.1709">Persistent UTC timer stops WireGuard at expires_at;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="358.6312" x="2426" y="1131.877">BindsTo/PartOf WireGuard, with no reverse After ordering.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="336.4922" x="2426" y="1149.583">preferred route falls away and terminal guard remains.</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="165" id="ent0114"><path d="M2154.5,1233.5679 L2154.5,1296.686 A0,0 0 0 0 2154.5,1296.686 L2527.3453,1296.686 A0,0 0 0 0 2527.3453,1296.686 L2527.3453,1243.5679 L2517.3453,1233.5679 L2345,1233.5679 L2341,1147.3696 L2337,1233.5679 L2154.5,1233.5679 A0,0 0 0 0 2154.5,1233.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M2517.3453,1233.5679 L2517.3453,1243.5679 L2527.3453,1243.5679 L2517.3453,1233.5679" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="281.3723" x="2160.5" y="1252.4649">The temporary macOS hub remains host-only.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="271.2972" x="2160.5" y="1270.1709">No persistent leaf-side kill switch is installed;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="351.8453" x="2160.5" y="1287.877">WireGuard teardown can restore the leaf's ordinary WAN.</text></g><!--entity PublicVPN--><g class="entity" data-qualified-name="Conventional Linux profiles.PublicVPN" data-source-line="14" id="ent0003"><rect fill="#F5F5F5" height="58.1358" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="88.6977" x="4009.5" y="74.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="68.6977" x="4019.5" y="99.0339">public-vpn</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="60.3958" x="4019.5" y="118.1018">host only</text></g><!--entity LanVPN--><g class="entity" data-qualified-name="Conventional Linux profiles.LanVPN" data-source-line="15" id="ent0004"><rect fill="#F5F5F5" height="58.1358" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="91.0917" x="4116.5" y="74.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="48.9998" x="4126.5" y="99.0339">lan-vpn</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="71.0917" x="4126.5" y="118.1018">host + LAN</text></g><!--entity ConfExamples--><g class="entity" data-qualified-name="Conventional Linux profiles.ConfExamples" data-source-line="16" id="ent0005"><rect fill="#F5F5F5" height="39.0679" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:0.5;" width="124.5256" x="4043.5" y="198.5679"/><ellipse cx="4059" cy="220.1358" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.5256" x="4065.5" y="223.5339">.example.conf</text></g><!--entity LocalConf--><g class="entity" data-qualified-name="Convent