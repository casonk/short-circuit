# short-circuit macvlan example config
#
# Copy to macvlan.local.conf and fill in real values before running
# scripts/setup_macvlan.sh. macvlan.local.conf is gitignored.
#
# MACVLAN_MAC must be a locally-administered unicast MAC — first octet must
# have bit 1 set (e.g. 02:xx:xx:xx:xx:xx). Generate one with:
#   printf '02:%02x:%02x:%02x:%02x:%02x\n' \
#     $(od -An -N5 -tu1 /dev/urandom | tr -s ' ' '\n' | grep -v '^$' | head -5)

MACVLAN_PARENT=enp5s0
MACVLAN_IFACE=macvlan0
MACVLAN_MAC=02:XX:XX:XX:XX:XX
MACVLAN_CON_NAME=spoof-mac
